name: korea-cinema-collector-curl-cffi-check
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'CGV screening date (YYYYMMDD)'
        type: string
        required: true
        default: '20260923'
      sequence:
        description: 'Yongsan IMAX scnSseq from the schedule response'
        type: string
        required: true
        default: '6'
permissions:
  contents: read
concurrency:
  group: cgv-curl-cffi-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install diagnostic HTTP client
        run: python -m pip install --disable-pip-version-check curl_cffi==0.16.3
      - name: Check calendar, schedule and individual seats once
        env:
          CGV_DATE: ${{ inputs.date }}
          CGV_SEQUENCE: ${{ inputs.sequence }}
        run: python scripts/probe-cgv-curl-cffi.py
