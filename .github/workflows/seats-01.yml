name: korea-cinema-collector-seats-01
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate receiver without DynamoDB writes or Telegram delivery
        type: boolean
        default: false
      duration_minutes:
        description: Budget including setup; ends by 30 seconds before the next hour
        type: number
        default: 59.5
permissions:
  contents: write
  id-token: write
concurrency:
  group: monday-seats-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set session deadline including setup
        env:
          REQUESTED_MINUTES: ${{ inputs.duration_minutes || 59.5 }}
        run: |
          node -e 'const n=Number(process.env.REQUESTED_MINUTES);if(!Number.isFinite(n)||n<1||n>60)process.exit(1);const now=Date.now();const nextHour=(Math.floor(now/3600000)+1)*3600000;const deadline=Math.min(now+Math.min(n,59.5)*60000,nextHour-30000);require("fs").appendFileSync(process.env.GITHUB_ENV,`COLLECTOR_END_AT=${deadline}\n`);'
      - name: Mask AWS resource identifiers
        env:
          RESOURCE_ACCOUNT: ${{ secrets.SEATS01_AWS_ACCOUNT_ID }}
          RESOURCE_ROLE: ${{ secrets.SEATS01_AWS_ROLE_ARN }}
          RESOURCE_ROLE_ID: ${{ secrets.SEATS01_AWS_ROLE_ID }}
          RESOURCE_FUNCTION: ${{ secrets.SEATS01_RECEIVER_FUNCTION }}
          RESOURCE_REGION: ${{ secrets.SEATS01_AWS_REGION }}
        run: |
          python3 - <<'PYMASK'
          import os
          for key,value in os.environ.items():
              if key.startswith('RESOURCE_') and value:
                  print('::add-mask::'+value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYMASK
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: state-seats-01
          path: state
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests before collection
        run: npm test
      - name: Browser cache week
        id: browser-week
        # Reuse the runtime within each UTC ISO week; refresh when dependencies change.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore browser runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/camoufox
          key: cgv-camoufox-weekly-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ steps.browser-week.outputs.week }}
      - name: Download browser on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --no-install camoufox-js fetch
      - name: Prepare display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
      - name: Verify browser and prepare missing system libraries
        run: xvfb-run -a node --import tsx scripts/prepare-browser.ts
      - name: Cache prepared runtime before collection
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Authenticate stored schedule and receiver access
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.SEATS01_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.SEATS01_AWS_REGION }}
          role-session-name: seats-01-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Read stored Monday schedule, collect seats, and deliver changed JSON
        env:
          RECEIVER_FUNCTION: ${{ secrets.SEATS01_RECEIVER_FUNCTION }}
          SEAT_SHARD: "01"
          SEAT_SCHEDULE_SOURCE: dynamodb
          TABLE_NAME: korea-cinema-alert
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          STATE_PATH: state/seats-01.json
        run: xvfb-run -a node --import tsx scripts/collect-weekday-seats-browser.ts
      - name: Persist acknowledged state or collection cooldown
        if: ${{ always() && inputs.dry_run != true }}
        working-directory: state
        run: bash ../scripts/persist-state.sh seats-01.json
