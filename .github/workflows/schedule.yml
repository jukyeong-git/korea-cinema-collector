name: korea-cinema-collector-schedule
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate receiver without DynamoDB writes or Telegram delivery
        type: boolean
        default: false
      duration_minutes:
        description: Collection duration, 1 to 60 minutes
        type: number
        default: 60
permissions:
  contents: write
  id-token: write
concurrency:
  group: schedule-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Mask AWS resource identifiers
        env:
          RESOURCE_ACCOUNT: ${{ secrets.SCHEDULE_AWS_ACCOUNT_ID }}
          RESOURCE_ROLE: ${{ secrets.SCHEDULE_AWS_ROLE_ARN }}
          RESOURCE_ROLE_ID: ${{ secrets.SCHEDULE_AWS_ROLE_ID }}
          RESOURCE_FUNCTION: ${{ secrets.SCHEDULE_RECEIVER_FUNCTION }}
          RESOURCE_TABLE: ${{ secrets.SCHEDULE_TABLE_NAME }}
          RESOURCE_REGION: ${{ secrets.SCHEDULE_AWS_REGION }}
        run: |
          python3 - <<'PYMASK'
          import os
          for key,value in os.environ.items():
              if key.startswith('RESOURCE_') and value:
                  print('::add-mask::'+value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYMASK
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: state
          path: state
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve latest compatible Camoufox release
        id: browser-version
        run: |
          node --input-type=module -e 'import {CamoufoxFetcher} from "camoufox-js/dist/pkgman.js"; import {appendFileSync} from "node:fs"; const f=new CamoufoxFetcher(); await f.init(); appendFileSync(process.env.GITHUB_OUTPUT,`version=${f.verstr}\n`);'
      - name: Restore browser runtime
        id: browser-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/camoufox
          key: cgv-camoufox-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Download browser on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          npx --no-install camoufox-js fetch
          node --input-type=module -e 'import {installedVerStr} from "camoufox-js/dist/pkgman.js"; if(installedVerStr()!==process.env.EXPECTED_VERSION) throw Error("Browser release changed during setup; rerun");'
        env:
          EXPECTED_VERSION: ${{ steps.browser-version.outputs.version }}
      - name: Prepare display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
      - name: Verify browser and prepare missing system libraries
        run: xvfb-run -a node --import tsx scripts/prepare-browser.ts
      - name: Cache prepared runtime before collection
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/camoufox
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - name: Authenticate receiver access
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.SCHEDULE_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.SCHEDULE_AWS_REGION }}
          role-session-name: schedule-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Collect in browser and deliver changed JSON
        env:
          TABLE_NAME: ${{ secrets.SCHEDULE_TABLE_NAME }}
          RECEIVER_FUNCTION: ${{ secrets.SCHEDULE_RECEIVER_FUNCTION }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DURATION_MINUTES: ${{ inputs.duration_minutes || 60 }}
          STATE_PATH: state/schedule.json
        run: xvfb-run -a node --import tsx scripts/collect-schedule-browser.ts
      - name: Persist acknowledged state or collection cooldown
        if: ${{ always() && inputs.dry_run != true }}
        working-directory: state
        run: bash ../scripts/persist-state.sh schedule.json
